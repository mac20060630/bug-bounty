version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0-jammy
    container_name: bugbounty-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: bugbounty
    volumes:
      - mongo-data:/data/db
    networks:
      - bugbounty-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bugbounty-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/bugbounty
      JWT_SECRET: production_jwt_secret_key_minimum_32_characters_long!
      JWT_EXPIRES_IN: 7d
      ADMIN_REGISTRATION_SECRET: production_admin_registration_secret_passphrase
      CLIENT_URL: http://localhost:80
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bugbounty-network

  # React Frontend Single Page Application (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bugbounty-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - bugbounty-network

volumes:
  mongo-data:
    driver: local
  server-uploads:
    driver: local

networks:
  bugbounty-network:
    driver: bridge
